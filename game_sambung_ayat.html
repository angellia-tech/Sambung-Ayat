<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22a06b">
<title>Game Sambung Ayat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#dff7ff,#fff7d6);color:#174b43;min-height:100vh}
.app{max-width:720px;margin:auto;padding:18px}.card{background:#ffffffeb;border-radius:28px;padding:24px;box-shadow:0 12px 35px #174b4320;margin:14px 0}
h1{font-size:clamp(32px,9vw,58px);line-height:1;margin:8px 0;color:#147c63;text-align:center}.sub{text-align:center;font-size:18px}
button{border:0;border-radius:18px;padding:15px 20px;font-size:17px;font-weight:800;cursor:pointer;width:100%;margin-top:10px;background:#20a66a;color:white;box-shadow:0 5px 0 #157d50}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #157d50}.option{background:#f5fbf9;color:#174b43;border:2px solid #cde9df;box-shadow:none;text-align:left}.option:hover{background:#e6f8ef}.option.correct{background:#d9f7df;border-color:#32a852}.option.wrong{background:#ffe1e1;border-color:#e55353}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#e3f5ff;padding:9px 14px;border-radius:99px;font-weight:800}.verse{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:30px;line-height:1.8;text-align:center;background:#fbfaf3;border:2px solid #eadfb9;border-radius:20px;padding:14px;margin:20px 0;direction:rtl}.progress{height:10px;background:#e4eee9;border-radius:99px;overflow:hidden}.bar{height:100%;background:#20a66a;width:0%;transition:.3s}.feedback{text-align:center;font-weight:800;font-size:20px;margin:15px 0;min-height:28px}.score{font-size:54px;text-align:center;font-weight:900;color:#e59a14}.small{text-align:center;color:#5e7770}.stars{text-align:center;font-size:34px;letter-spacing:5px}.badge{display:inline-block;background:#fff0a8;border-radius:99px;padding:7px 14px;font-weight:800}.mascot{font-size:70px;text-align:center}
</style>
</head>
<body>
<div class="app">
<section id="start" class="card">
<div class="mascot">📖🌟</div>
<h1>Game<br>Sambung Ayat</h1>
<p class="sub">Yuk uji hafalan Al-Qur'an!<br>20 soal pilihan ganda 🎯</p>
<p class="small">Surah: Al-Fatihah • An-Nas • Al-Falaq • Al-Ikhlas • Al-Lahab</p>
<button onclick="startGame()">🚀 Mulai Game</button>
</section>

<section id="game" class="hidden">
<div class="card">
<div class="top"><span class="pill" id="counter">Soal 1 dari 20</span><span class="badge">⭐ <span id="score">0</span></span></div>
<div style="margin:16px 0" class="progress"><div class="bar" id="bar"></div></div>
<div class="verse" id="verse"></div>
<h2 style="text-align:center;font-size:20px">Lanjutan ayat tersebut adalah...</h2>
<div id="options"></div>
<div class="feedback" id="feedback"></div>
<button id="next" class="hidden" onclick="nextQuestion()">➡️ Lanjut</button>
</div>
</section>

<section id="result" class="hidden card">
<div class="mascot">🏆✨</div><h1>Hasil Akhir</h1>
<div class="score" id="finalScore">0 / 100</div>
<div class="stars" id="stars">⭐⭐⭐</div>
<p class="sub" id="message"></p>
<p class="small" id="detail"></p>
<button onclick="startGame()">🔄 Main Lagi</button>
</section>
</div>
<script>
const qs=[
["الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",["الرَّحْمَٰنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ"],0],
["الرَّحْمَٰنِ الرَّحِيمِ",["الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","مَالِكِ يَوْمِ الدِّينِ","رَبِّ الْعَالَمِينَ","غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ"],1],
["اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",["صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ","إِيَّاكَ نَعْبُدُ","وَلَا الضَّالِّينَ","مَالِكِ يَوْمِ الدِّينِ"],0],
["قُلْ أَعُوذُ بِرَبِّ النَّاسِ",["مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","إِلَٰهِ النَّاسِ","الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","مِنَ الْجِنَّةِ وَالنَّاسِ"],1],
["مَلِكِ النَّاسِ",["مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","إِلَٰهِ النَّاسِ","الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","مِنَ الْجِنَّةِ وَالنَّاسِ"],1],
["مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",["مَلِكِ النَّاسِ","إِلَٰهِ النَّاسِ","الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","مِنَ الْجِنَّةِ وَالنَّاسِ"],2],
["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",["وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","مِن شَرِّ مَا خَلَقَ","وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ","وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ"],1],
["مِن شَرِّ مَا خَلَقَ",["وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ"],2],
["وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",["وَمِن شَرِّ مَا خَلَقَ","قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ"],3],
["قُلْ هُوَ اللَّهُ أَحَدٌ",["لَمْ يَلِدْ وَلَمْ يُولَدْ","اللَّهُ الصَّمَدُ","وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ"],1],
["اللَّهُ الصَّمَدُ",["قُلْ هُوَ اللَّهُ أَحَدٌ","وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","لَمْ يَلِدْ وَلَمْ يُولَدْ","مِن شَرِّ مَا خَلَقَ"],2],
["لَمْ يَلِدْ وَلَمْ يُولَدْ",["اللَّهُ الصَّمَدُ","قُلْ هُوَ اللَّهُ أَحَدٌ","وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ","مِنَ الْجِنَّةِ وَالنَّاسِ"],2],
["وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",["لَمْ يَلِدْ وَلَمْ يُولَدْ","اللَّهُ الصَّمَدُ","قُلْ هُوَ اللَّهُ أَحَدٌ","مِن شَرِّ مَا خَلَقَ"],0],
["تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ",["سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ","وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ","مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ","فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ"],2],
["مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ",["سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ","تَبَّتْ يَدَا أَبِي لَهَبٍ","وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ","فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ"],0],
["سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ",["مَا أَغْنَىٰ عَنْهُ مَالُهُ","وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ","فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ","وَتَبَّ"],1],
["وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ",["سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ","فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ","مَا أَغْنَىٰ عَنْهُ مَالُهُ","تَبَّتْ يَدَا أَبِي لَهَبٍ"],1],
["صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ",["اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","وَلَا الضَّالِّينَ","غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ"],2],
["الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",["مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","إِلَٰهِ النَّاسِ","مِنَ الْجِنَّةِ وَالنَّاسِ","مَلِكِ النَّاسِ"],2]
];
let i=0,score=0,locked=false;
function startGame(){i=0;score=0;document.getElementById("start").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("game").classList.remove("hidden");show();}
function show(){locked=false;const q=qs[i];document.getElementById("counter").textContent=`Soal ${i+1} dari ${qs.length}`;document.getElementById("score").textContent=score;document.getElementById("bar").style.width=`${i/qs.length*100}%`;document.getElementById("verse").textContent=q[0];document.getElementById("feedback").textContent="";document.getElementById("next").classList.add("hidden");const box=document.getElementById("options");box.innerHTML="";q[1].forEach((x,n)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<b>${String.fromCharCode(65+n)}.</b> <span dir="rtl">${x}</span>`;b.onclick=()=>answer(n,b);box.appendChild(b)});}
function answer(n,b){if(locked)return;locked=true;const q=qs[i], buttons=[...document.querySelectorAll(".option")];buttons.forEach(x=>x.disabled=true);if(n===q[2]){score+=5;b.classList.add("correct");document.getElementById("feedback").textContent="🎉 MasyaAllah! Jawaban benar +5";}else{b.classList.add("wrong");buttons[q[2]].classList.add("correct");document.getElementById("feedback").textContent="💡 Belum tepat. Jawaban yang benar ditandai hijau.";}document.getElementById("score").textContent=score;document.getElementById("next").classList.remove("hidden");}
function nextQuestion(){i++;if(i>=qs.length)finish();else show();}
function finish(){document.getElementById("game").classList.add("hidden");document.getElementById("result").classList.remove("hidden");document.getElementById("finalScore").textContent=`${score} / 100`;let s=score>=90?"⭐⭐⭐⭐⭐":score>=70?"⭐⭐⭐⭐":score>=50?"⭐⭐⭐":score>=30?"⭐⭐":"⭐";document.getElementById("stars").textContent=s;document.getElementById("message").textContent=score>=80?"MasyaAllah, hafalanmu hebat! 🌟":"Tetap semangat! Yuk ulangi lagi dan terus murojaah. 📖";document.getElementById("detail").textContent=`Kamu mendapatkan ${score/5} jawaban benar dari ${qs.length} soal.`}
</script>
</body>
</html>
